services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  partidas-service:
    image: partidas-service:latest
    build: .
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      EUREKA_SERVER: ${EUREKA_SERVER:-http://host.docker.internal:8762/eureka/}
      EUREKA_INSTANCE_HOST: ${EUREKA_INSTANCE_HOST:-host.docker.internal}
    depends_on:
      redis:
        condition: service_healthy
