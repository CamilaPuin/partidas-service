services:
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:?Define REDIS_PORT in .env}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  partidas-service:
    image: partidas-service:latest
    build: .
    ports:
      - "${PARTIDAS_PORT:?Define PARTIDAS_PORT in .env}:8000"
    environment:
      REDIS_HOST: redis
      EUREKA_SERVER: ${EUREKA_SERVER:?Define EUREKA_SERVER in .env}
      EUREKA_INSTANCE_HOST: ${EUREKA_INSTANCE_HOST:?Define EUREKA_INSTANCE_HOST in .env}
    depends_on:
      redis:
        condition: service_healthy
