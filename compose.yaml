services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:?Define REDIS_PORT in .env}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  partidas-service:
    image: partidas-service:latest
    build: .
    ports:
      - "${PARTIDAS_PORT:?Define PARTIDAS_PORT in .env}:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EUREKA_SERVER: ${EUREKA_SERVER:?Define EUREKA_SERVER in .env}
      EUREKA_INSTANCE_HOST: ${EUREKA_INSTANCE_HOST:-localhost}
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
