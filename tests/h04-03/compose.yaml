services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - type: tmpfs
        target: /data
        tmpfs:
          size: 16777216
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks:
      - h04_test

  pytest:
    build:
      context: ../..
      dockerfile: tests/h04-03/Dockerfile
    environment:
      H04_TEST_REDIS_HOST: redis
      H04_TEST_REDIS_PORT: "6379"
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      redis:
        condition: service_healthy
    command:
      [
        "python",
        "-m",
        "pytest",
        "-q",
        "tests",
        "--ignore=tests/integration/test_h04_04_kafka_dlq.py",
      ]
    networks:
      - h04_test

networks:
  h04_test:
    internal: true
